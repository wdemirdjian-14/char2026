# =========================================================
#  char2026.walautao.fr — bloc server nginx
#
#  Installation sur le VPS :
#     sudo cp nginx-char2026.conf /etc/nginx/sites-available/char2026.walautao.fr
#     sudo ln -s /etc/nginx/sites-available/char2026.walautao.fr \
#                /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#
#  Puis le certificat HTTPS :
#     sudo certbot --nginx -d char2026.walautao.fr
#  (certbot réécrit ce fichier pour ajouter le bloc 443)
#
#  Adaptez « root » et la version de PHP-FPM à votre VPS.
# =========================================================

server {
    listen 80;
    listen [::]:80;
    server_name char2026.walautao.fr;

    root /var/www/char2026.walautao.fr;
    index index.html index.php;

    charset utf-8;

    # ---- Données collectées : jamais servies ----
    # Filet de sécurité si /data se retrouve malgré tout dans la racine web.
    location ^~ /data/ {
        deny all;
        return 404;
    }

    # ---- Fichiers cachés (.git, .env, .htaccess…) ----
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # ---- Site ----
    location / {
        try_files $uri $uri/ =404;
    }

    # ---- PHP (API du compteur) ----
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;   # <-- adaptez la version
        fastcgi_param HTTP_PROXY "";
        # Emplacement des données, hors racine web :
        fastcgi_param CHAR2026_DATA_DIR /var/www/char2026-data;
    }

    # ---- En-têtes de sécurité ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- Compression ----
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- Cache des ressources statiques ----
    location ~* \.(css|js|png|jpe?g|gif|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # L'API ne doit jamais être mise en cache
    location = /api/support.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;   # <-- adaptez la version
        fastcgi_param CHAR2026_DATA_DIR /var/www/char2026-data;
        add_header Cache-Control "no-store" always;
    }

    access_log /var/log/nginx/char2026.access.log;
    error_log  /var/log/nginx/char2026.error.log;
}
