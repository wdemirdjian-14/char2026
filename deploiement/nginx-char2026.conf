# Redirection HTTP -> HTTPS
server {
    if ($host = www.char2026.fr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = char2026.fr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = char2026.walautao.fr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name char2026.walautao.fr char2026.fr www.char2026.fr;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }






}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name char2026.walautao.fr char2026.fr www.char2026.fr;
    ssl_certificate /etc/letsencrypt/live/char2026.walautao.fr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/char2026.walautao.fr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/char2026.walautao.fr;
    index index.php index.html;
    charset utf-8;
    client_max_body_size 25m;

    # Données collectées : jamais servies (filet de sécurité)
    location ^~ /data/ { deny all; return 404; }
    location ^~ /inc/ { deny all; return 404; }
    location = /contenu.json { deny all; return 404; }
    location ~ /\.(?!well-known) { deny all; return 404; }

    location / { try_files $uri $uri/ =404; }

    # API PHP — active dès que php-fpm est installé
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/char2026-fpm.sock;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param CHAR2026_DATA_DIR /var/www/char2026-data;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        fastcgi_param CHAR2026_EXPORT_KEY "REMPLACEZ_PAR_VOTRE_CLE";
    }

    location ~* \.(css|js|png|jpe?g|gif|svg|webp|woff2?|mp3|m4a|ogg)$ {
        expires 7d; add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    gzip on; gzip_vary on; gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/char2026.access.log;
    error_log  /var/log/nginx/char2026.error.log;



}
