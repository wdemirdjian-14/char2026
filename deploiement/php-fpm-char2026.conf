; Pool dédié à char2026.walautao.fr
; Le processus tourne en www-data (propriétaire des données),
; mais le socket appartient à warren, l'utilisateur sous lequel
; tourne nginx sur ce serveur.
[char2026]
user = www-data
group = www-data

listen = /run/php/char2026-fpm.sock
listen.owner = warren
listen.group = warren
listen.mode = 0660

pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 30s
pm.max_requests = 500

php_admin_value[expose_php] = Off
php_admin_value[upload_max_filesize] = 24M
php_admin_value[post_max_size] = 25M
php_admin_value[max_execution_time] = 60
