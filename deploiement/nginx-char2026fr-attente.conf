# ---------------------------------------------------------------
#  char2026.fr — bloc d'attente
#  Tant qu'aucun certificat n'existe pour ce domaine, on répond en
#  HTTP : on sert les défis ACME (pour que certbot puisse délivrer
#  le certificat) et on renvoie les visiteurs vers le site en place.
#  Une fois le certificat obtenu, remplacer par le bloc définitif
#  (voir deploiement/activer-char2026-fr.sh).
# ---------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name char2026.fr www.char2026.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 302 https://char2026.walautao.fr$request_uri;
    }
}
