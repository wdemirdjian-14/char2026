name: Déploiement char2026.walautao.fr

# Déclenchement par TAG uniquement : `git tag v1.0.0 && git push origin v1.0.0`
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:        # permet aussi un lancement manuel depuis l'onglet Actions

concurrency:
  group: deploiement-char2026
  cancel-in-progress: false

jobs:
  deployer:
    name: Envoi sur le VPS
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Vérification des secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          manquants=""
          [ -n "$VPS_HOST" ]    || manquants="$manquants VPS_HOST"
          [ -n "$VPS_USER" ]    || manquants="$manquants VPS_USER"
          [ -n "$VPS_SSH_KEY" ] || manquants="$manquants VPS_SSH_KEY"
          [ -n "$VPS_PATH" ]    || manquants="$manquants VPS_PATH"
          if [ -n "$manquants" ]; then
            echo "::error::Secrets manquants :$manquants"
            echo "À définir dans Settings › Secrets and variables › Actions."
            exit 1
          fi
          echo "✓ Secrets présents"

      - name: Préparation de la clé SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploiement
          chmod 600 ~/.ssh/deploiement
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "✓ Clé installée"

      - name: Envoi des fichiers (rsync)
        # --delete nettoie les fichiers obsolètes, MAIS /data est protégé :
        # il contient la liste des soutiens collectés sur le site.
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          rsync -az --delete --human-readable \
            -e "ssh -i $HOME/.ssh/deploiement -p ${VPS_PORT:-22} -o StrictHostKeyChecking=yes" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.gitignore' \
            --exclude 'LISEZMOI.txt' \
            --exclude 'README.md' \
            --exclude 'assets/img/_source/' \
            --exclude '.DS_Store' \
            --filter 'protect assets/programme/' \
            --filter 'protect data/supporters.jsonl' \
            --filter 'protect data/ratelimit.json' \
            --filter 'protect data/*.json' \
            --filter 'protect data/*.jsonl' \
            ./ "$VPS_USER@$VPS_HOST:$VPS_PATH/"

      - name: Dossier de données hors racine web
        # nginx ignore les .htaccess : les données collectées sont stockées
        # à côté de la racine du site, jamais dedans.
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          script=$(cat <<'DISTANT'
            set -e
            racine="__VPS_PATH__"
            donnees="$(dirname "$racine")/char2026-data"
            mkdir -p "$donnees"
            chmod 775 "$donnees"
            [ -f "$donnees/supporters.jsonl" ] || : > "$donnees/supporters.jsonl"
            chmod 664 "$donnees/supporters.jsonl"
            # l'utilisateur de PHP-FPM doit pouvoir écrire
            chgrp -R www-data "$donnees" 2>/dev/null || true
            echo "Dossier de données : $donnees"
            ls -la "$donnees"
          DISTANT
          )
          printf '%s' "${script//__VPS_PATH__/$VPS_PATH}" | \
            ssh -i "$HOME/.ssh/deploiement" -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" bash -s

      - name: Contrôle de mise en ligne
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://char2026.walautao.fr/ || echo 000)
          echo "Page d'accueil : HTTP $code"
          api=$(curl -s --max-time 20 'https://char2026.walautao.fr/api/support.php?action=stats' || echo '')
          echo "API compteur   : ${api:-aucune réponse}"
          if [ "$code" != "200" ]; then
            echo "::warning::La page ne répond pas encore en 200 — vérifiez la racine du sous-domaine sur le VPS."
          fi
          case "$api" in
            *'"ok":true'*) echo "✓ Compteur opérationnel" ;;
            *) echo "::warning::L'API du compteur ne répond pas — vérifiez PHP et les droits sur /data." ;;
          esac
